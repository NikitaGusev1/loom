name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # 22, not the engines-minimum 20: `node --test "<glob>"` needs node's
          # native glob expansion (added in 21) — on 20 the quoted pattern is
          # treated as a literal path and the suite finds no tests.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
